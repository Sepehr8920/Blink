name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create fresh Flutter project
        run: flutter create --org com.blink --project-name blink blink_app

      - name: Checkout our code
        uses: actions/checkout@v4
        with:
          path: our_code

      - name: Copy our code into project
        run: |
          cp our_code/lib/main.dart blink_app/lib/main.dart
          cp our_code/pubspec.yaml blink_app/pubspec.yaml

      - name: Get dependencies
        working-directory: ./blink_app
        run: flutter get

      - name: Build APK
        working-directory: ./blink_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blink-apk
          path: blink_app/build/app/outputs/flutter-apk/app-release.apk
