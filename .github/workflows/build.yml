name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Create fresh Flutter project
        run: flutter create --org com.blink --project-name blink blink_app

      - name: Checkout our code
        uses: actions/checkout@v4
        with:
          path: our_code

      - name: Copy our code into project
        run: |
          mkdir -p blink_app/lib/services
          cp our_code/lib/main.dart blink_app/lib/main.dart
          cp our_code/lib/services/notification_service.dart blink_app/lib/services/notification_service.dart
          cp our_code/lib/services/settings_service.dart blink_app/lib/services/settings_service.dart
          cp our_code/lib/services/sound_service.dart blink_app/lib/services/sound_service.dart
          cp our_code/pubspec.yaml blink_app/pubspec.yaml

      - name: Patch Android build config
        run: |
          cat > blink_app/android/app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.blink.blink"
              compileSdk = flutter.compileSdkVersion
              ndkVersion = "27.0.12077973"

              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_11.toString()
              }

              defaultConfig {
                  applicationId = "com.blink.blink"
                  minSdk = flutter.minSdkVersion
                  targetSdk = flutter.targetSdkVersion
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
                  multiDexEnabled = true
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              coreLibraryDesugaring(
                  "com.android.tools:desugar_jdk_libs:2.1.4"
              )
          }
          EOF

      - name: Patch AndroidManifest
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path

          path = Path(
              "blink_app/android/app/src/main/AndroidManifest.xml"
          )

          content = path.read_text()

          permissions = """
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
          <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
          <uses-permission android:name="android.permission.WAKE_LOCK"/>
          <uses-permission android:name="android.permission.VIBRATE"/>
          """

          marker = "<application"

          if marker not in content:
              raise RuntimeError(
                  "Could not find <application in AndroidManifest.xml"
              )

          content = content.replace(
              marker,
              permissions + "\n    " + marker,
              1,
          )

          path.write_text(content)

          print("Final AndroidManifest.xml:")
          print(path.read_text())
          PYEOF

      - name: Validate AndroidManifest
        run: |
          python3 - << 'PYEOF'
          import xml.etree.ElementTree as ET

          path = "blink_app/android/app/src/main/AndroidManifest.xml"

          try:
              ET.parse(path)
              print("AndroidManifest.xml is valid XML.")
          except ET.ParseError as e:
              print("Invalid AndroidManifest.xml:")
              print(e)
              raise
          PYEOF

      - name: Get dependencies
        working-directory: ./blink_app
        run: flutter pub get

      - name: Build APK
        working-directory: ./blink_app
        run: flutter build apk --release

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: blink-apk
          path: blink_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Blink v1.0.${{ github.run_number }}
          files: blink_app/build/app/outputs/flutter-apk/app-release.apk
